---
- name: Configure Repos
  hosts: all
  become: true
  tasks:

    - name : Add BaseOS
      ansible.builtin.yum_repository:
        name: BaseOS
        description: BaseOS REPO
        file: base_os
        baseurl: http://content.example.com/repo/BaseOS
        gpgcheck: yes
        gpgkey: http://content.example.com/repo/RPM-GPG-KEY-redhat-release

    - name: Add AppStream
      ansible.builtin.yum_repository:
        name: AppStream
        description: AppStream REPO
        file: AppStream
        baseurl: http://content.example.com/repo/AppStream
        gpgcheck: yes
        gpgkey: http://content.example.com/repo/RPM-GPG-KEY-redhat-release